name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Plugin Database-compatible build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install
        env:
          NODE_ENV: production

      - name: Build production plugin
        run: pnpm run build
        env:
          NODE_ENV: production
